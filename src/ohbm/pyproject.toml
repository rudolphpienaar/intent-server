[project]
name = "ohbm-agentic-sim"
version = "0.1.0"
description = "Simulation of agentic orchestration failures for OHBM abstract figures."
authors = [{ name = "ChRIS IAS Team" }]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
]

[project.scripts]
ohbm2026 = "ohbm2026.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["ohbm2026", "ohbm2026.*"]
